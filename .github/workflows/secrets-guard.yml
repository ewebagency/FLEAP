name: Secrets guard

on: [push, pull_request]

jobs:
  no-public-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interdire les secrets derrière un préfixe NEXT_PUBLIC_
        run: |
          # Les variables NEXT_PUBLIC_* sont inlinées dans le bundle client.
          # Un secret (service_role, client_secret, mot de passe, clé privée) ne doit JAMAIS y figurer.
          if grep -rnE "NEXT_PUBLIC_[A-Z0-9_]*(SERVICE_ROLE|SECRET|PASSWORD|PRIVATE)" app --include=*.ts --include=*.tsx; then
            echo "::error::Un secret est exposé derrière NEXT_PUBLIC_ (embarqué dans le bundle client). Renomme-le en variable serveur (sans préfixe NEXT_PUBLIC_)."
            exit 1
          fi
          echo "OK — aucun secret public détecté."
